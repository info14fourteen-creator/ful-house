<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>ful.house — terminal</title><link rel="icon" href="/favicon.ico?v=brand-1" sizes="any"><link rel="icon" href="/favicon.svg?v=brand-1" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=brand-1"><link rel="manifest" href="/manifest.json?v=brand-1">
<link rel="stylesheet" href="/static/terminal-login.css?v=no-browser-hints-1">
<script defer src="/static/terminal-login.js?v=no-browser-hints-1"></script>
<link rel="stylesheet" href="/static/idle.css?v=idle-3"><script defer src="/static/idle.js?v=idle-3"></script></head>
<body>
<main aria-label="Fullhouse terminal login">
<p class="connection"><span id="connection" role="status">Connecting to your server.</span> <time id="clock"></time></p>
<p class="invitation">Ready to see how deep the rabbit hole goes?</p>
<form id="terminal" novalidate autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
<div class="line" id="login-line"><label for="fh-command">login:</label><input id="fh-command" name="fh-command" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" data-form-type="other" inputmode="text" enterkeyhint="next" aria-label="login" autofocus><span class="cursor" aria-hidden="true"></span></div>
<div class="line" id="password-line" hidden><label for="fh-response">password:</label><input id="fh-response" name="fh-response" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" data-form-type="other" inputmode="text" enterkeyhint="go" aria-label="password"><span id="password-mask" aria-hidden="true"></span><span class="cursor" aria-hidden="true"></span></div>
<p id="feedback" role="status" aria-live="polite"></p>
</form>
</main>
</body>
</html>
