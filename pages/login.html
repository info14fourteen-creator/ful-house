<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>ful.house — terminal</title>
<link rel="stylesheet" href="/static/terminal-login.css">
<script defer src="/static/terminal-login.js"></script>
</head>
<body>
<main aria-label="Fullhouse terminal login">
<p class="connection"><span id="connection" role="status">Connecting to your server.</span> <time id="clock"></time></p>
<p class="invitation">Ready to see how deep the rabbit hole goes?</p>
<form id="terminal" novalidate autocomplete="on">
<div class="line" id="login-line"><label for="login">login:</label><input id="login" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" enterkeyhint="next" aria-label="login" autofocus><span class="cursor" aria-hidden="true"></span></div>
<div class="line" id="password-line" hidden><label for="password">password:</label><input id="password" name="password" type="password" autocomplete="current-password" enterkeyhint="go" aria-label="password"><span class="cursor" aria-hidden="true"></span></div>
<p id="feedback" role="status" aria-live="polite"></p>
</form>
</main>
</body>
</html>
