    <text x="512" y="500" opacity="0">F<animate attributeName="opacity" values="0;1;0;0;0;0;0;0" keyTimes="0;.125;.25;.375;.5;.625;.75;.875" dur="2.8s" calcMode="discrete" repeatCount="indefinite"/></text>
    <text x="512" y="500" opacity="0">U<animate attributeName="opacity" values="0;0;1;0;0;0;0;0" keyTimes="0;.125;.25;.375;.5;.625;.75;.875" dur="2.8s" calcMode="discrete" repeatCount="indefinite"/></text>
    <text x="512" y="500" opacity="0">S<animate attributeName="opacity" values="0;0;0;1;0;0;0;0" keyTimes="0;.125;.25;.375;.5;.625;.75;.875" dur="2.8s" calcMode="discrete" repeatCount="indefinite"/></text>
    <text x="512" y="500" opacity="0">L<animate attributeName="opacity" values="0;0;0;0;1;0;0;0" keyTimes="0;.125;.25;.375;.5;.625;.75;.875" dur="2.8s" calcMode="discrete" repeatCount="indefinite"/></text>
    <text x="512" y="500" opacity="0">E<animate attributeName="opacity" values="0;0;0;0;0;1;0;0" keyTimes="0;.125;.25;.375;.5;.625;.75;.875" dur="2.8s" calcMode="discrete" repeatCount="indefinite"/></text>
    <text x="512" y="500" opacity="0">O<animate attributeName="opacity" values="0;0;0;0;0;0;1;0" keyTimes="0;.125;.25;.375;.5;.625;.75;.875" dur="2.8s" calcMode="discrete" repeatCount="indefinite"/></text>
    <text x="512" y="500" opacity="0">U<animate attributeName="opacity" values="0;0;0;0;0;0;0;1" keyTimes="0;.125;.25;.375;.5;.625;.75;.875" dur="2.8s" calcMode="discrete" repeatCount="indefinite"/></text>
  </g>
  <g fill="#baffcf" opacity="0"><rect x="315" y="435" width="394" height="18"><animate attributeName="opacity" values="0;.75;0;0" dur=".7s" repeatCount="indefinite"/></rect><rect x="378" y="615" width="270" height="11"><animate attributeName="opacity" values="0;0;.55;0" dur=".9s" repeatCount="indefinite"/></rect></g>
  <rect x="18" y="18" width="988" height="988" rx="192" fill="none" stroke="url(#edge)" stroke-width="7"/><rect x="36" y="36" width="952" height="952" rx="178" fill="none" stroke="#92ffb3" stroke-opacity=".12" stroke-width="2"/>
</svg>
