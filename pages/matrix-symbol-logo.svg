<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">ful.house animated glyph</title>
  <desc id="desc">A single ful.house letter changes over a green digital rain effect.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#07331a"/><stop offset=".55" stop-color="#01130a"/><stop offset="1" stop-color="#000503"/></radialGradient>
    <linearGradient id="rain" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9ffe4"/><stop offset=".08" stop-color="#54ff8a"/><stop offset=".6" stop-color="#00c94f"/><stop offset="1" stop-color="#00782e" stop-opacity="0"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#54ff8d" stop-opacity=".9"/><stop offset=".5" stop-color="#00ab41" stop-opacity=".18"/><stop offset="1" stop-color="#54ff8d" stop-opacity=".62"/></linearGradient>
    <filter id="glyphGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="20" result="b"/><feFlood flood-color="#1fff69" flood-opacity=".9"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="rainGlow" x="-80%" y="-20%" width="260%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="screen"><rect x="22" y="22" width="980" height="980" rx="188"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="204" fill="url(#bg)"/>
  <g clip-path="url(#screen)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="600" fill="url(#rain)" opacity=".72">
    <g><text x="70" y="40">F<tspan x="70" dy="54">U</tspan><tspan x="70" dy="54">L</tspan><tspan x="70" dy="54">H</tspan><tspan x="70" dy="54">O</tspan><tspan x="70" dy="54">U</tspan><tspan x="70" dy="54">S</tspan><tspan x="70" dy="54">E</tspan></text><animateTransform attributeName="transform" type="translate" values="0 -500;0 1250" dur="4.1s" repeatCount="indefinite"/></g>
    <g><text x="160" y="20">U<tspan x="160" dy="54">S</tspan><tspan x="160" dy="54">E</tspan><tspan x="160" dy="54">L</tspan><tspan x="160" dy="54">H</tspan><tspan x="160" dy="54">F</tspan><tspan x="160" dy="54">O</tspan></text><animateTransform attributeName="transform" type="translate" values="0 -650;0 1250" dur="5.8s" repeatCount="indefinite"/></g>
    <g><text x="258" y="70">L<tspan x="258" dy="54">F</tspan><tspan x="258" dy="54">H</tspan><tspan x="258" dy="54">U</tspan><tspan x="258" dy="54">E</tspan><tspan x="258" dy="54">S</tspan><tspan x="258" dy="54">O</tspan></text><animateTransform attributeName="transform" type="translate" values="0 -500;0 1250" dur="3.6s" repeatCount="indefinite"/></g>
    <g><text x="352" y="5">H<tspan x="352" dy="54">O</tspan><tspan x="352" dy="54">U</tspan><tspan x="352" dy="54">F</tspan><tspan x="352" dy="54">S</tspan><tspan x="352" dy="54">L</tspan><tspan x="352" dy="54">E</tspan></text><animateTransform attributeName="transform" type="translate" values="0 -700;0 1250" dur="5.2s" repeatCount="indefinite"/></g>
    <g><text x="626" y="60">O<tspan x="626" dy="54">E</tspan><tspan x="626" dy="54">S</tspan><tspan x="626" dy="54">U</tspan><tspan x="626" dy="54">H</tspan><tspan x="626" dy="54">L</tspan><tspan x="626" dy="54">F</tspan></text><animateTransform attributeName="transform" type="translate" values="0 -600;0 1250" dur="4.7s" repeatCount="indefinite"/></g>
    <g><text x="728" y="25">U<tspan x="728" dy="54">L</tspan><tspan x="728" dy="54">O</tspan><tspan x="728" dy="54">F</tspan><tspan x="728" dy="54">E</tspan><tspan x="728" dy="54">H</tspan><tspan x="728" dy="54">S</tspan></text><animateTransform attributeName="transform" type="translate" values="0 -750;0 1250" dur="6.1s" repeatCount="indefinite"/></g>
    <g><text x="830" y="85">S<tspan x="830" dy="54">H</tspan><tspan x="830" dy="54">E</tspan><tspan x="830" dy="54">L</tspan><tspan x="830" dy="54">U</tspan><tspan x="830" dy="54">O</tspan><tspan x="830" dy="54">F</tspan></text><animateTransform attributeName="transform" type="translate" values="0 -500;0 1250" dur="3.9s" repeatCount="indefinite"/></g>
    <g><text x="930" y="35">E<tspan x="930" dy="54">U</tspan><tspan x="930" dy="54">F</tspan><tspan x="930" dy="54">O</tspan><tspan x="930" dy="54">L</tspan><tspan x="930" dy="54">S</tspan><tspan x="930" dy="54">H</tspan></text><animateTransform attributeName="transform" type="translate" values="0 -680;0 1250" dur="5.5s" repeatCount="indefinite"/></g>
  </g>
  <g opacity=".28" filter="url(#rainGlow)" stroke="#2cff75" stroke-width="10"><path d="M72 120v250M258 20v310M728 80v290M930 170v330"/></g>
  <circle cx="512" cy="506" r="260" fill="#001b0b" opacity=".82"/><circle cx="512" cy="506" r="242" fill="none" stroke="#28ff73" stroke-opacity=".17" stroke-width="2"/>
  <g text-anchor="middle" dominant-baseline="central" fill="#caffd8" stroke="#1fff69" stroke-width="4" paint-order="stroke fill" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="520" font-weight="800" filter="url(#glyphGlow)">
